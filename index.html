<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Toolbox</title>
<style>
:root{
  --bg:#141414;--bg2:#1e1e1e;--bg3:#191919;--bg4:#111;
  --border:#2a2a2a;--border2:#252525;--border3:#383838;
  --text:#f5f3ee;--text2:#dedad2;--text3:#a8a49c;--text4:#6a6660;--text5:#3e3a36;
  --del-bg:#3a1818;--del-fg:#d89090;
  --copy-ok-bg:#1a2e1a;--copy-ok-fg:#90d890;
  --add-border:#333;--tab-active-border:#888;--row-hover:#2a2a2a;
  --save-dirty:#c0392b;--save-dirty-bg:#2a1010;--save-dirty-border:#5a2020;
  --save-clean:#27ae60;--save-clean-bg:#102a10;--save-clean-border:#205a20;
  --accent:#4a8fd4;--accent-bg:#1a2a3a;
  --warn-fg:#d4a027;--warn-bg:#2a2010;
  --check-done-bg:#1a2a1a;
}
html[data-theme="light"]{
  --bg:#f5f4f0;--bg2:#fff;--bg3:#fafafa;--bg4:#eeecea;
  --border:#ddd;--border2:#e8e8e8;--border3:#ccc;
  --text:#1a1a18;--text2:#3a3a38;--text3:#666;--text4:#999;--text5:#ccc;
  --del-bg:#f0d4d4;--del-fg:#5a1a1a;
  --copy-ok-bg:#e8f4e8;--copy-ok-fg:#2a6a2a;
  --add-border:#ccc;--tab-active-border:#444;--row-hover:#f0efec;
  --save-dirty:#e74c3c;--save-dirty-bg:#fdf0f0;--save-dirty-border:#e0a0a0;
  --save-clean:#27ae60;--save-clean-bg:#f0fdf0;--save-clean-border:#a0d0a0;
  --accent:#2a5caa;--accent-bg:#e8f0fb;
  --warn-fg:#92400e;--warn-bg:#fef3c7;
  --check-done-bg:#f0fdf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background .2s,color .2s;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;background:var(--bg4);border-bottom:1px solid var(--border);padding:8px 14px;}
.topbar-title{font-size:14px;font-weight:600;color:var(--text2);}
.topbar-right{display:flex;gap:6px;align-items:center;margin-left:auto;}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border3);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;}
.tb-btn:hover{background:var(--bg3);color:var(--text);}
#autosave-ind{font-size:11px;color:var(--text4);opacity:0;transition:opacity .4s;}

/* MAIN TABS */
.main-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg4);padding:0 14px;overflow-x:auto;scrollbar-width:none;}
.main-tabs::-webkit-scrollbar{display:none;}
.main-tab{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;font-size:13px;font-weight:500;color:var(--text4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.main-tab:hover{color:var(--text2);}
.main-tab.active{color:var(--text);border-bottom-color:var(--tab-active-border);}

/* SUB-TABS */
.sub-tabs-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--bg3);padding:0 1.5rem;overflow-x:auto;scrollbar-width:none;min-height:38px;}
.sub-tabs-bar::-webkit-scrollbar{display:none;}
.sub-tab-wrap{display:inline-flex;flex-direction:row;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;flex-shrink:0;cursor:grab;}
.sub-tab-wrap.active-wrap{border-bottom-color:var(--accent);}
.sub-tab-wrap.dragging{opacity:.4;}
.sub-tab-wrap.drag-over{border-left:2px solid var(--accent);}
.sub-tab{padding:8px 10px 8px 14px;font-size:12px;font-weight:500;color:var(--text4);cursor:pointer;white-space:nowrap;border-bottom:none;}
.sub-tab.active{color:var(--text);}
.sub-tab-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:100%;cursor:pointer;background:transparent;border:none;padding:0;color:var(--text5);transition:color .15s;}
.sub-tab-icon:hover{color:var(--text2);}
.sub-tab-icon.del:hover{color:var(--del-fg);}
.sub-tab-add{display:inline-flex;align-items:center;padding:0 10px;font-size:18px;color:var(--text5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.sub-tab-add:hover{color:var(--accent);}
.sub-tab-rename-inp{padding:4px 8px;font-size:12px;border:1px solid var(--accent);border-radius:5px;background:var(--bg2);color:var(--text);outline:none;min-width:80px;}

/* TAB PANES */
.tab-pane{display:none;}.tab-pane.active{display:block;}
.page-pad{padding:1.2rem 1.5rem 2rem;}

/* SHARED */
.sbtn{padding:6px 13px;font-size:13px;font-weight:500;border-radius:8px;border:1px solid var(--border3);background:var(--bg2);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.sbtn:hover{background:var(--bg3);}.sbtn:active{transform:scale(.98);}
.sbtn.accent{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.sbtn.danger{border-color:var(--save-dirty-border);background:var(--save-dirty-bg);color:var(--save-dirty);}
.sbtn.copied{border-color:var(--copy-ok-fg);background:var(--copy-ok-bg);color:var(--copy-ok-fg);}
.sbtn.urgent-active{border-color:#e6473d;background:rgba(230,71,61,.14);color:#e6473d;}
.sbtn.has-content{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.inp{padding:7px 10px;font-size:14px;border:1px solid var(--border3);border-radius:8px;background:var(--bg3);color:var(--text);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--accent);}
select.inp{cursor:pointer;}
select.inp option{background:var(--bg2);color:var(--text);}
.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);margin-bottom:10px;}
.del-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--text5);cursor:pointer;font-size:16px;transition:all .15s;flex-shrink:0;}
.del-btn:hover{background:var(--del-bg);color:var(--del-fg);}
.empty-state{text-align:center;padding:3rem;color:var(--text4);font-size:13px;font-style:italic;}

/* ══ TRACKER ══ */
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:1.2rem;flex-wrap:wrap;}
.date-nav-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border3);background:var(--bg2);color:var(--text3);font-size:14px;cursor:pointer;transition:all .15s;}
.date-nav-btn:hover{background:var(--bg3);color:var(--text);}
.date-today-btn{padding:4px 12px;font-size:12px;border-radius:6px;border:1px solid var(--border3);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;}
.date-today-btn:hover{background:var(--bg3);color:var(--text);}
.date-inp{padding:5px 10px;font-size:13px;border-radius:7px;border:1px solid var(--border3);background:var(--bg2);color:var(--text);cursor:pointer;outline:none;}
.date-label{font-size:14px;font-weight:600;color:var(--text);}
.attendance-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;}
.trk-views{display:flex;gap:4px;margin-bottom:1rem;border-bottom:1px solid var(--border);}
.trk-view-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text4);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;}
.trk-view-btn:hover{color:var(--text2);}
.trk-view-btn.active{color:var(--text);border-bottom-color:var(--accent);}
.trk-log-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:13px;}
.trk-log-ref{font-family:'Cascadia Code','Consolas',monospace;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;}
.trk-log-text{flex:1;word-break:break-word;color:var(--text);}
.mc-time-inp.att-auto,.mc-time-inp.att-auto-in{font-style:italic;color:var(--accent);border-style:dashed;}
.attendance-total{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:20px;padding:4px 10px;}
.summary-chips{display:flex;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;}
.chip{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:110px;}
.chip .cv{font-size:18px;font-weight:700;font-family:'Cascadia Code','Consolas',monospace;color:var(--text);}
.chip .cl{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,opacity .2s,filter .2s;}
.mc:hover{border-color:var(--border3);}
.mc.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.mc.done{opacity:.42;filter:saturate(.35);}
.mc.done:hover{opacity:.72;filter:saturate(.65);}
.mc-head{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--bg3);border-bottom:1px solid var(--border2);}
.mc-name{font-size:14px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-badge{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid;font-weight:500;white-space:nowrap;flex-shrink:0;}
.mc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pdot 1.2s ease-in-out infinite;}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}
.mc-body{display:flex;align-items:center;gap:10px;padding:10px 13px;flex-wrap:wrap;}
.mc-time{font-size:22px;font-weight:700;font-family:'Cascadia Code','Consolas',monospace;color:var(--text);min-width:90px;}
.mc-time.running{color:var(--accent);}
.mc-btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.mc-btn{padding:5px 12px;font-size:12px;border-radius:7px;border:1px solid var(--border3);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;}
.mc-btn:hover{background:var(--bg3);color:var(--text);}
.mc-btn.start{border-color:var(--save-clean-border);background:var(--save-clean-bg);color:var(--save-clean);}
.mc-btn.stop{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.mc-timerange{display:flex;align-items:center;gap:6px;margin-top:4px;}
.mc-time-inp{padding:2px 6px;font-size:12px;font-family:'Cascadia Code','Consolas',monospace;border:1px solid var(--border3);border-radius:5px;background:var(--bg3);color:var(--text3);outline:none;cursor:pointer;}
.mc-time-inp:focus{border-color:var(--accent);color:var(--text);}
/* TRACKER ATTR TABLE */
.attr-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.attr-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.attr-tbl th{padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text4);border-bottom:1px solid var(--border2);background:var(--bg3);text-align:left;}
.attr-tbl th.cc{width:36px;text-align:center;}
.attr-tbl td{padding:8px 12px;border-bottom:1px solid var(--border2);color:var(--text2);vertical-align:middle;}
.attr-tbl td.cc{text-align:center;}
.attr-tbl tr.grp td{background:var(--bg3);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text4);}
.attr-tbl tr.grp:hover td{background:var(--bg3);}
.attr-tbl tr.data:hover td{background:var(--row-hover);}
.attr-tbl tr:last-child td{border-bottom:none;}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.tval{font-family:'Cascadia Code','Consolas',monospace;font-weight:600;color:var(--text);}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.copy-bar{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.copy-bar-info{font-size:12px;color:var(--text4);flex:1;}

/* ══ UKOLOVNÍK ══ */
.todo-list{display:flex;flex-direction:column;gap:6px;}
.todo-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:border-color .15s,opacity .2s;}
.todo-row:hover{border-color:var(--border3);}
.todo-row.checked{opacity:.45;filter:saturate(.3);}
.todo-row.urgent{border-color:#e6473d;background:rgba(230,71,61,.09);}
.todo-urgent-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#e6473d;border:1px solid #e6473d;border-radius:20px;padding:2px 8px;background:rgba(230,71,61,.12);}
.todo-note-area{display:none;margin-top:6px;}
.todo-note-area.open{display:block;}
.todo-note-inp{width:100%;padding:6px 8px;font-size:12px;line-height:1.5;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;resize:vertical;min-height:56px;font-family:inherit;}
.todo-note-inp:focus{border-color:var(--accent);}
.todo-checklist-area{display:none;flex-direction:column;gap:4px;margin-top:6px;}
.todo-checklist-area.open{display:flex;}
.todo-checklist-item{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 8px;background:var(--bg3);border-radius:7px;}
.todo-checklist-item span{flex:1;word-break:break-word;}
.todo-checklist-item.done span{text-decoration:line-through;opacity:.5;}
.todo-checklist-add{display:flex;gap:6px;margin-top:2px;}
.todo-checklist-inp{flex:1;padding:6px 8px;font-size:12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg3);color:var(--text);outline:none;font-family:inherit;}
.todo-checklist-inp:focus{border-color:var(--accent);}

/* ══ KALENDÁŘ ══ */
.cal-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.cal-header-title{font-size:16px;font-weight:700;color:var(--text);min-width:150px;text-align:center;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-weekday{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text4);text-align:center;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:6px;min-height:78px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;overflow:hidden;}
.cal-day:hover{border-color:var(--border3);}
.cal-day.other-month{opacity:.35;}
.cal-day.today{border-color:var(--accent);}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text2);}
.cal-day.today .cal-day-num{color:var(--accent);}
.cal-day-evt{font-size:10px;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.cal-day-more{font-size:10px;color:var(--text4);}
.cal-day-note-preview{font-size:10px;color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;}
.cal-day-note-preview svg{flex-shrink:0;}
.cal-day-flags{display:flex;gap:4px;align-items:center;}
.cal-day-worked{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--text2);}
.cal-day-worked .over{color:var(--accent);}
.cal-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.cal-sum-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.cal-sum-item.over{border-color:var(--accent);background:var(--accent-bg);}
.cal-sum-val{font-size:18px;font-weight:700;color:var(--text);font-family:'Cascadia Code','Consolas',monospace;}
.cal-sum-item.over .cal-sum-val{color:var(--accent);}
.cal-sum-lbl{font-size:11px;color:var(--text4);margin-top:2px;}
.cal-preset-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;}
.cal-preset-row .cal-preset-name{font-weight:600;min-width:80px;}
.cal-preset-row .cal-preset-text{flex:1;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-event-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;}
.cal-event-row:hover{border-color:var(--border3);}
.cal-event-recur-badge{font-size:10px;color:var(--text4);border:1px solid var(--border2);border-radius:20px;padding:1px 7px;}
.todo-cb{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.todo-body{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
.todo-desc{font-size:14px;color:var(--text);word-break:break-word;}
.todo-desc.done{text-decoration:line-through;color:var(--text4);}
.todo-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.todo-date{font-size:11px;color:var(--text4);display:inline-flex;align-items:center;gap:3px;}
.todo-proj-badge{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid;font-weight:500;}

/* ══ POZNÁMKY ══ */
.note-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:border-color .15s;}
.note-card:hover{border-color:var(--border3);}
.note-card.dirty{border-left:3px solid var(--warn-fg);}
.note-card.nsaved{border-left:3px solid var(--save-clean);}
.note-card-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border2);}
.note-title-inp{flex:1;padding:5px 8px;font-size:14px;font-weight:600;background:transparent;border:none;outline:none;color:var(--text);}
.note-title-inp:focus{background:var(--accent-bg);border-radius:5px;}
.note-title-inp::placeholder{color:var(--text5);}
.note-body{padding:10px 12px;}
.note-textarea{width:100%;min-height:120px;padding:8px;font-size:13px;line-height:1.7;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);outline:none;resize:vertical;font-family:inherit;transition:border-color .15s;}
.note-textarea:focus{border-color:var(--accent);background:var(--bg2);}
.note-footer{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border2);}
.note-saved-lbl{font-size:11px;color:var(--save-clean);margin-left:auto;opacity:0;transition:opacity .3s;}
.note-saved-lbl.show{opacity:1;}
.note-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px dashed var(--border3);border-radius:10px;background:transparent;color:var(--text4);font-size:13px;cursor:pointer;transition:all .15s;}
.note-add-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ══ DECISION MATRIX ══ */
.dm-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border);scrollbar-width:thin;scrollbar-color:var(--border3) var(--bg3);height:calc(12 * 40px + 70px);min-height:160px;max-height:80vh;resize:vertical;}
.dm-wrap::-webkit-scrollbar{height:10px;width:10px;}
.dm-wrap::-webkit-scrollbar-track{background:var(--bg3);}
.dm-wrap::-webkit-scrollbar-corner{background:var(--bg3);}
.dm-wrap::-webkit-scrollbar-thumb{background:var(--border3);border-radius:6px;border:2px solid var(--bg3);}
.dm-wrap::-webkit-scrollbar-thumb:hover{background:var(--text4);}
.dm-tbl{border-collapse:separate;border-spacing:0;min-width:100%;}
.dm-tbl td,.dm-tbl th{border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:0;}
.dm-tbl thead th{position:sticky;top:0;}
.dm-thead-row2 td,.dm-thead-row2 th{position:sticky;}
.dm-hl-col{background:var(--bg3);width:34px;min-width:34px;text-align:center;vertical-align:top;padding-top:8px;position:sticky;left:0;z-index:5;}
.dm-corner{background:var(--bg4);width:var(--dm-label-w,220px);min-width:160px;max-width:480px;position:sticky;left:34px;z-index:5;box-shadow:1px 0 0 var(--border2);vertical-align:middle;height:36px;}
.dm-title-inp{width:100%;padding:0 10px;height:100%;font-size:12px;font-style:italic;background:transparent;color:var(--text4);border:none;outline:none;box-sizing:border-box;}
.dm-title-inp:focus{background:var(--accent-bg);color:var(--text);font-style:normal;}
.dm-col-head{background:var(--bg3);text-align:center;min-width:60px;z-index:4;padding:0;position:relative;height:36px;vertical-align:middle;}
.dm-col-inp{width:100%;padding:0 22px 0 6px;height:100%;font-size:12px;font-weight:600;text-align:center;background:transparent;color:var(--text2);border:none;outline:none;box-sizing:border-box;}
.dm-col-inp:focus{background:var(--accent-bg);color:var(--text);}
.dm-col-del{position:absolute;top:3px;right:3px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;border:none;background:transparent;color:var(--text5);cursor:pointer;font-size:11px;line-height:1;transition:all .12s;}
.dm-col-del:hover{background:var(--del-bg);color:var(--del-fg);}
.dm-col-sum{font-size:10px;font-family:'Cascadia Code','Consolas',monospace;color:var(--accent);padding:2px 4px;text-align:center;background:var(--bg3);z-index:4;}
.dm-add-col-th{background:var(--bg3);z-index:4;}
.dm-add-col-btn{padding:5px 10px;background:transparent;border:none;color:var(--text5);cursor:pointer;font-size:18px;transition:color .13s;display:block;width:100%;}
.dm-add-col-btn:hover{color:var(--accent);}
.dm-row-label-td{background:var(--bg3);width:var(--dm-label-w,220px);min-width:160px;max-width:480px;padding:0;position:sticky;left:34px;z-index:2;box-shadow:1px 0 0 var(--border2);vertical-align:top;}
.dm-row-inp{display:block;width:100%;padding:7px 24px 7px 10px;font-size:13px;line-height:1.4;background:transparent;color:var(--text);border:none;outline:none;resize:vertical;overflow:auto;font-family:inherit;white-space:pre-wrap;word-break:break-word;min-height:32px;}
.dm-row-inp:focus{background:var(--accent-bg);}
.dm-row-inp:disabled,.dm-row-inp[readonly]{cursor:default;}
.dm-row-del{position:absolute;top:4px;right:4px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:none;background:var(--bg3);color:var(--text5);cursor:pointer;font-size:13px;transition:all .12s;opacity:.7;}
.dm-row-del:hover{background:var(--del-bg);color:var(--del-fg);opacity:1;}
.dm-sum-col{position:sticky;right:0;z-index:2;background:var(--bg3);}
.dm-row-sum{font-size:10px;font-family:'Cascadia Code','Consolas',monospace;color:var(--accent);padding:4px 8px;background:var(--bg3);text-align:center;white-space:nowrap;}
.dm-tbl tr.dm-row-checked .dm-row-label-td,.dm-tbl tr.dm-row-checked .dm-cb-td,.dm-tbl tr.dm-row-checked .dm-row-sum{background:var(--check-done-bg);}
.dm-tbl tr.dm-row-checked .dm-row-inp{color:var(--text3);}
.dm-tbl tr.dm-row-highlighted td{background:var(--accent-bg) !important;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);}
.dm-tbl tr.dm-row-highlighted .dm-row-inp{color:var(--text);font-weight:600;}
.dm-cb-td{text-align:center;vertical-align:middle;padding:6px 8px;cursor:pointer;}
.dm-cb-td:hover{background:var(--row-hover);}
.dm-cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.dm-add-row-td{padding:5px 8px;background:var(--bg3);}
.dm-tfoot-row td{position:sticky;bottom:0;z-index:2;background:var(--bg3);border-top:2px solid var(--border2);}
.dm-add-row-btn{padding:3px 12px;font-size:12px;border-radius:6px;border:1px dashed var(--border3);background:transparent;color:var(--text4);cursor:pointer;transition:all .13s;}
.dm-add-row-btn:hover{border-color:var(--accent);color:var(--accent);}
.dm-toolbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.dm-table-title{width:100%;padding:8px 10px;font-size:14px;font-weight:600;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;margin-bottom:10px;}
.dm-table-title:focus{border-color:var(--accent);}

/* SETTINGS PANEL */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
.settings-overlay.open{opacity:1;pointer-events:auto;}
.settings-panel{background:var(--bg2);border-left:1px solid var(--border3);width:380px;max-width:100vw;height:100vh;overflow-y:auto;transform:translateX(30px);transition:transform .2s;}
.settings-overlay.open .settings-panel{transform:translateX(0);}
.sp-head{display:flex;align-items:center;padding:13px 15px;border-bottom:1px solid var(--border2);background:var(--bg3);position:sticky;top:0;z-index:1;}
.sp-title{font-size:14px;font-weight:600;flex:1;}
.sp-close{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--text3);font-size:18px;cursor:pointer;}
.sp-close:hover{background:var(--del-bg);color:var(--del-fg);}
.sp-body{padding:14px;}
.sp-section{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:12px;}
.sp-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);margin-bottom:10px;}
.sp-row{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:5px;flex-wrap:wrap;}
.sp-inp{flex:1;padding:5px 8px;font-size:13px;border:1px solid var(--border3);border-radius:6px;background:var(--bg);color:var(--text);outline:none;}
.sp-inp:focus{border-color:var(--accent);}
.sp-add-row{display:flex;gap:7px;margin-top:6px;}
.sp-add-inp{flex:1;padding:6px 10px;font-size:13px;border:1px dashed var(--add-border);border-radius:7px;background:transparent;color:var(--text);outline:none;}
.sp-add-inp:focus{border-color:var(--text3);}
.sp-add-inp::placeholder{color:var(--text5);}
.color-select-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0;}
.color-select-dot{position:absolute;left:8px;width:12px;height:12px;border-radius:50%;pointer-events:none;}
.color-select{appearance:none;padding:5px 24px 5px 26px;font-size:12px;border:1px solid var(--border3);border-radius:7px;background:var(--bg);color:var(--text);outline:none;cursor:pointer;}
.color-select:focus{border-color:var(--accent);}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-ov.open{opacity:1;pointer-events:auto;}
.modal{background:var(--bg2);border:1px solid var(--border3);border-radius:14px;padding:20px;width:420px;max-width:calc(100vw - 24px);transform:scale(.95);transition:transform .2s;}
.modal-ov.open .modal{transform:scale(1);}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;}
.modal-row{margin-bottom:12px;}
.modal-label{font-size:12px;color:var(--text4);margin-bottom:5px;}
.modal-inp{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--border3);border-radius:8px;background:var(--bg3);color:var(--text);outline:none;}
.modal-inp:focus{border-color:var(--accent);}
.modal-footer{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.time-row{display:flex;gap:6px;align-items:center;}
.time-inp{width:70px;padding:7px 8px;font-size:14px;font-family:'Cascadia Code','Consolas',monospace;border:1px solid var(--border3);border-radius:7px;background:var(--bg3);color:var(--text);text-align:center;outline:none;}
.time-inp:focus{border-color:var(--accent);}
.time-sep{color:var(--text4);font-size:16px;}
</style>
</head>

function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) ?? (I18N.cs[key] ?? key); }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('pnt_lang', lang);
  document.documentElement.lang = lang;
  rerenderEverything();
}

function rerenderEverything(){
  renderStaticLabels();
  trkRenderDay();
  renderTodoTabs();
  renderNotesTabs();
  renderGridTabs();
  if(document.getElementById('pane-alarm').classList.contains('active')) renderAlarmPage();
  if(document.getElementById('settings-ov').classList.contains('open')){ spAttRender(); spRenderAkce(); spRenderProj(); renderAboutSection(); }
}

const APP_VERSION = '1.16.0';

const CHANGELOG = [
  { version: '1.16.0', notes: { cs: 'Záznamy dne: zaškrtávací pole u hlavičky nadúkolu označí všechny záznamy jen v tomto nadúkolu (částečný výběr se zobrazí jako neúplné zaškrtnutí, nadřazené pole „vše“ to také respektuje). Kopírování označených záznamů bez vybraných sloupců má stejný formát jako kopírování všeho: „Projekt - Nadúkol“ a pod ním řádky „ticket - popis“, jen pro označené záznamy.', en: 'Daily log: the checkbox on a parent-task header selects all entries of that parent task only (a partial selection shows as indeterminate, the select-all box respects it too). Copying selected entries with no columns chosen uses the same format as copying everything: "Project - Parent task" with "ticket - description" lines below, for the selected entries only.' } },
  { version: '1.15.1', notes: { cs: 'Ukládání: aplikace po každé změně hned vynutí zápis dat na disk (nové preload.js). Chrání před ztrátou posledních změn, když se aplikace ukončí násilně (zavření terminálu, Správce úloh, pád).', en: 'Saving: after every change the app now forces the data to be written to disk right away (new preload.js). Protects the latest changes when the app is terminated abruptly (closing the terminal, Task Manager, crash).' } },
  { version: '1.15.0', notes: { cs: 'Ukolovník: poznámka a checklist (podúkoly) jsou u úkolu vždy vidět, pokud mají obsah – ikony slouží k přidání nového obsahu a přesunu kurzoru. Řazení: urgentní úkoly nahoře, hned pod nimi od nejnovějšího (podle data, při shodě naposledy přidaný první), splněné úkoly dole.', en: 'To-Do: a task note and checklist (sub-tasks) are always visible when they have content – the icons are for adding new content and moving the cursor there. Sorting: urgent tasks on top, right below them newest first (by date, same date: most recently added first), completed tasks at the bottom.' } },
  { version: '1.14.1', notes: { cs: 'Oprava úpravy času: pole času se dají znovu psát z klávesnice (kliknutím na hodiny/minuty a zadáním číslic). Dřív klik otevřel výběr s rolováním, který psaní blokoval; výběr zůstává dostupný přes ikonu hodin v poli.', en: 'Time editing fix: time fields can be typed into again (click the hours/minutes and enter digits). Previously a click opened the scroll picker, which blocked typing; the picker is still available via the clock icon in the field.' } },
  { version: '1.14.0', notes: { cs: 'Oprava: krok na předchozí den přeskakoval o dva dny (a krok dopředu se zasekl) – datumy se nově počítají v místním čase; stejná chyba způsobovala, že „dnes“ bylo po půlnoci ještě včerejšek. Docházka: jedno zaškrtávací pole zapíše příchod při spuštění a odchod při zavření aplikace (ručně zadané časy se nepřepisují). Kalendář: typ dne (dovolená / nemoc / státní svátek, tlačítko pro státní svátky ČR), v dnech odpracovaná doba a přesčas, pod kalendářem měsíční souhrn (odpracováno, přesčas, odpracované dny, dovolená, nemoc, svátky). Pracovní doba v hodinách se nastavuje v Nastavení.', en: 'Fix: stepping to the previous day skipped two days (and stepping forward got stuck) – dates are now computed in local time; the same bug made "today" still be yesterday after midnight. Attendance: one checkbox records check-in on app start and check-out on close (manual times are never overwritten). Calendar: day type (vacation / sick / public holiday, button for Czech public holidays), worked time and overtime per day, monthly summary below the calendar (time worked, overtime, days worked, vacation, sick, holidays). Working hours per day are set in Settings.' } },
  { version: '1.13.0', notes: { cs: 'Píchačka: v Nastavení lze zadat předdefinovaný čas odchodu (předvyplní se po zaznamenání Příchodu) a zapnout automatický zápis odchodu při zavření aplikace. Automaticky doplněný odchod je zobrazen kurzívou a ručně zadaný čas se nikdy nepřepisuje. Prázdným polem lze čas Příchodu/Odchodu smazat.', en: 'Punch clock: Settings now has a predefined check-out time (pre-filled once Check-in is recorded) and an option to record check-out automatically when the app is closed. An automatically filled check-out is shown in italics and a manually entered time is never overwritten. Clearing the field removes the Check-in/Check-out time.' } },
  { version: '1.12.0', notes: { cs: 'Záznamy dne – Nadúkol: nový výběr Nadúkol (akce z Trackeru) vedle projektu. Nadúkol = projekt + akce; lze přidat samotný (vznikne hlavička skupiny, bez duplicit). Záznamy s ticketem a popisem se řadí pod hlavičku odsazené. Po přidání zůstane vybraný projekt a nadúkol. Kopírování: „Projekt - Nadúkol“ a pod ním řádky „ticket - popis“, záznamy bez nadúkolu jako dřív. Starší záznamy se chovají beze změny.', en: 'Daily log – Parent task: new Parent task select (Tracker action) next to the project. Parent task = project + action; it can be added on its own (creates a group header, no duplicates). Entries with ticket and description are listed indented under the header. Project and parent task stay selected after adding. Copy: "Project - Parent task" with "ticket - description" lines below; entries without a parent task as before. Older entries behave unchanged.' } },
  { version: '1.11.0', notes: { cs: 'Záznamy dne: nadúkoly jsou předdefinované akce z Trackeru. Záznam se přidává pod nadúkol (Projekt - Nadúkol) jako ticket a vykonaná práce; tabulka je seskupená podle nadúkolů, tlačítko + u skupiny předvyplní další záznam. Kopírování umí sloupce Projekt / Nadúkol / Ticket / Práce. Odstraněn samostatný seznam předdefinovaných úkolů z verze 1.10.', en: 'Daily log: parent tasks are the predefined actions from the Tracker. Entries are added under a parent task (Project - Parent task) as ticket and work done; the table is grouped by parent task and the + button on a group pre-fills the next entry. Copy supports Project / Parent task / Ticket / Work columns. The separate predefined-task list from 1.10 was removed.' } },
  { version: '1.10.1', notes: { cs: 'Oprava Úkolovníku: rozepsaný (ještě nepřidaný) úkol, jeho datum a projekt se už neztratí při klepnutí na jiné tlačítko v seznamu (urgence, hotovo, checklist, propis do záznamů apod.) ani při přepnutí záložky. Po přidání úkolu zůstává kurzor v poli pro další.', en: 'To-Do fix: a task being typed (not yet added), with its date and project, is no longer lost when pressing another button in the list (urgency, done, checklist, log, etc.) or when switching tabs. The cursor stays in the field after adding.' } },
  { version: '1.10.0', notes: { cs: 'Záznamy dne: tabulka s výběrem řádků a sloupců (Projekt / Ticket / Popis) a kopírováním ve formátu Projekt-Ticket-Popis jako u časovače. Nově lze nadefinovat napevno úkoly a nadúkoly (projekt + ticket + název) a rychle je vybrat při přidávání záznamu.', en: 'Daily log: table with row and column selection (Project / Ticket / Description) and copying as Project-Ticket-Description like the timer. You can now define fixed tasks and parent tasks (project + ticket + name) and pick them quickly when adding an entry.' } },
  { version: '1.9.1', notes: { cs: 'Ukolovník: nové tlačítko u úkolu, které propíše jeho název do Záznamů dne v Trackeru (na dnešní den, bez duplicit).', en: 'To-Do: new button on each task that copies its title into the Tracker Daily log (for today, no duplicates).' } },
  { version: '1.9.0', notes: { cs: 'Tracker: nová podzáložka „Záznamy dne“ pro evidenci ticketů a úkolů, na kterých se daný den pracovalo (projekt, ticket, popis; úprava, mazání, kopírování). Přepínač Čas / Záznamy dne pod datem. Import dat nyní doplní chybějící pole ze starších záloh.', en: 'Tracker: new "Daily log" sub-view for tracking tickets and tasks worked on each day (project, ticket, description; edit, delete, copy). Time / Daily log switch under the date. Data import now fills in fields missing from older backups.' } },
  { version: '1.8.1', notes: { cs: 'Tracker: u píchaček (Příchod/Odchod) se nyní počítá a zobrazuje celkový odpracovaný čas (např. 8:00 → 16:30 = 8:30), promítá se i do propsaného řádku v poznámce Kalendáře.', en: 'Tracker: the punch-clock (Check-in/Check-out) now calculates and shows total time worked (e.g. 8:00 → 16:30 = 8:30), also reflected in the synced Calendar note line.' } },
  { version: '1.8.0', notes: { cs: 'Tracker: nová "píchačka" — tlačítka Příchod a Odchod vedle data, zaznamenají aktuální čas a lze je i ručně upravit jako ostatní časy v Trackeru. Naměřené časy se automaticky propisují jako řádek do poznámky odpovídajícího dne v Kalendáři.', en: 'Tracker: new punch-clock — Check-in and Check-out buttons next to the date, record the current time and can also be edited manually like other Tracker times. The measured times are automatically written as a line into the Calendar note for that day.' } },

function renderAboutSection(){

}

/* PERSIST */
function loadS(){
  try{
    const raw=localStorage.getItem('pnt_v4'); if(!raw) return;
    const d=JSON.parse(raw);
    if(d.akceDefs) S.akceDefs=d.akceDefs;
    if(d.projDefs) S.projDefs=d.projDefs;
    if(d.days) S.days=d.days;
    if(d.alarms) S.alarms=d.alarms;
    if(d.todoTabs) S.todoTabs=d.todoTabs;
    if(d.notesTabs){
      // migrate old single-text format
      d.notesTabs.forEach(t=>{if(t.text!==undefined&&!t.items){t.items=[{id:uid(),title:'Poznámka',text:t.text,saved:true}];delete t.text;}});
      S.notesTabs=d.notesTabs;
    }
    if(d.gridTabs&&d.gridTabs.length){
      const valid=d.gridTabs.every(tab=>!tab.rows.length||tab.rows.every(row=>!tab.cols.length||typeof Object.values(row.cells||{})[0]!=='string'));
      if(valid) S.gridTabs=d.gridTabs;
    }
    if(d.calEvents) S.calEvents=d.calEvents;
    if(d.calNotes) S.calNotes=d.calNotes;
    if(d.calPresets) S.calPresets=d.calPresets;
    if(d.attendance) S.attendance=d.attendance;
    if(d.trkLog) S.trkLog=d.trkLog;
    if(d.attCfg) S.attCfg=attCfgNormalize(d.attCfg);
    if(d.calDayType) S.calDayType=d.calDayType;
    migrateTrkLog();
  }catch(e){}
}
function saveS(){localStorage.setItem('pnt_v4',JSON.stringify(S));showAutosaveIndicator();if(window.otFlush){clearTimeout(window.__otFlushT);window.__otFlushT=setTimeout(window.otFlush,150);}}

let _autosaveInd=null;
function showAutosaveIndicator(){
  const el=document.getElementById('autosave-ind'); if(!el) return;
  el.style.opacity='1'; clearTimeout(_autosaveInd);
  _autosaveInd=setTimeout(()=>el.style.opacity='0',1500);
}

/* UTILS */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function localDateStr(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function todayStr(){return localDateStr(new Date());}
function pad(n){return String(n).padStart(2,'0');}
function fmtSecs(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${pad(h)}:${pad(m)}:${pad(ss)}`:`${pad(m)}:${pad(ss)}`;}
function getProj(name){return S.projDefs.find(p=>p.name===name)||{name,color:'#6a6660'};}
function getDayMs(d){if(!S.days[d])S.days[d]=[];return S.days[d];}
function getLiveElapsed(m){return m.running?(m.elapsed||0)+(Date.now()-m.startedAt)/1000:(m.elapsed||0);}
function dateLabel(d){
  const today=todayStr(),yest=new Date();yest.setDate(yest.getDate()-1);const ys=localDateStr(yest);
  const str=new Date(d+'T00:00:00').toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'});
  return d===today?str+' (dnes)':d===ys?str+' (včera)':str;
}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyText(text,btnId){

function startRenameSubTab(kind,tabId,el){
  if(document.getElementById('sub-rename-active')) return; // prevent double
  const arr=kind==='todo'?S.todoTabs:kind==='notes'?S.notesTabs:kind==='alarm'?S.alarms:S.gridTabs;
  const tab=arr.find(x=>x.id===tabId); if(!tab) return;
  const orig=tab.name;
  const inp=document.createElement('input'); inp.id='sub-rename-active'; inp.className='sub-tab-rename-inp'; inp.value=tab.name;
  el.innerHTML=''; el.appendChild(inp); inp.focus(); inp.select();
  let saved=false;
  const done=(save)=>{
    if(saved) return; saved=true;
    if(save && inp.value.trim()) tab.name=inp.value.trim();
    saveS();
    if(kind==='todo')renderTodoTabs();
    else if(kind==='notes')renderNotesTabs();
    else renderGridTabs();
  };
  inp.onblur=()=>done(true);
  inp.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();done(true);}if(e.key==='Escape'){tab.name=orig;done(false);}e.stopPropagation();};
}

let _dragTabId=null;
function buildSubTabBar(bar,tabs,activeId,setActive,rename,lockFn,unlockFn,delFn,addFn){
  bar.innerHTML='';
  tabs.forEach(tab=>{
    const wrap=document.createElement('div');
    const isActive=tab.id===activeId;
    wrap.className='sub-tab-wrap'+(isActive?' active-wrap':'');
    wrap.draggable=true;
    wrap.dataset.tabId=tab.id;
    wrap.ondragstart=(e)=>{_dragTabId=tab.id;e.dataTransfer.effectAllowed='move';setTimeout(()=>wrap.classList.add('dragging'),0);};
    wrap.ondragend=()=>{_dragTabId=null;bar.querySelectorAll('.sub-tab-wrap').forEach(w=>w.classList.remove('dragging','drag-over'));};
    wrap.ondragover=(e)=>{if(!_dragTabId||_dragTabId===tab.id)return;e.preventDefault();wrap.classList.add('drag-over');};
    wrap.ondragleave=()=>{wrap.classList.remove('drag-over');};
    wrap.ondrop=(e)=>{
      e.preventDefault();wrap.classList.remove('drag-over');
      if(!_dragTabId||_dragTabId===tab.id)return;
      const fromIdx=tabs.findIndex(x=>x.id===_dragTabId);
      const toIdx=tabs.findIndex(x=>x.id===tab.id);
      if(fromIdx<0||toIdx<0)return;
      const [moved]=tabs.splice(fromIdx,1);
      tabs.splice(toIdx,0,moved);
      _dragTabId=null;
      saveS();
      setActive(activeId);
    };
    const d=document.createElement('div');
    d.className='sub-tab'+(isActive?' active':'');
    let _clickTimer=null;
    d.onclick=()=>{
      if(_clickTimer){clearTimeout(_clickTimer);_clickTimer=null;return;} // part of a dblclick, ignore
      _clickTimer=setTimeout(()=>{_clickTimer=null;setActive(tab.id);},220);
    };
    d.ondblclick=(e)=>{
      e.preventDefault();
      if(_clickTimer){clearTimeout(_clickTimer);_clickTimer=null;}
      if(!tab.locked)rename(tab.id,d);
    };
    d.textContent=tab.name; wrap.appendChild(d);
    const lockBtn=document.createElement('button'); lockBtn.className='sub-tab-icon';
    lockBtn.title=tab.locked?t('unlock'):t('lock');
    lockBtn.innerHTML=tab.locked?LOCK_SVG:UNLOCK_SVG;
    lockBtn.onclick=(e)=>{e.stopPropagation();tab.locked?unlockFn(tab.id):lockFn(tab.id);};
    wrap.appendChild(lockBtn);
    if(!tab.locked){
      const delBtn=document.createElement('button'); delBtn.className='sub-tab-icon del';
      delBtn.title=t('deleteTab'); delBtn.innerHTML='<span style="font-size:16px;line-height:1">×</span>';
      const _id=tab.id; delBtn.onclick=(e)=>{e.stopPropagation();delFn(_id);};
      wrap.appendChild(delBtn);
    }
    bar.appendChild(wrap);
  });
  const plus=document.createElement('div'); plus.className='sub-tab-add'; plus.textContent='＋';
  plus.onclick=addFn; bar.appendChild(plus);
}

function trkLogCopy(){
  const items=S.trkLog[trkDate]||[];
  const order=['projekt','akce','ticket','popis'];
  const cols=order.filter(k=>trkLogColChecks[k]);
  const sel=items.filter(i=>trkLogRowChecks[i.id]);
  const lines=[];
  if(!cols.length){
    // no column chosen: "project - parent task" header, below it "ticket - description" lines; entries without parent as "project - ticket - description".
    // With rows selected only those rows (and the headers of their parent tasks) are copied.
    const pick=sel.length?new Set(sel.map(i=>i.id)):null;
    trkLogGroups(items).forEach(b=>{
      if(b.type==='row'){if(pick&&!pick.has(b.item.id))return;const l=[b.item.proj,b.item.ref,b.item.text].filter(Boolean).join(' - ');if(l)lines.push(l);return;}
      const kids=pick?b.items.filter(i=>pick.has(i.id)):b.items;
      if(pick&&!kids.length)return;
      lines.push([b.proj,b.akce].filter(Boolean).join(' - '));
      kids.forEach(it=>{const l=[it.ref,it.text].filter(Boolean).join(' - ');if(l)lines.push(l);});
    });
  }else{
    const rows=(sel.length?sel:items.filter(i=>!(i.akce&&!i.ref&&!i.text)));
    rows.forEach(it=>{const p=[];if(cols.includes('projekt'))p.push(it.proj);if(cols.includes('akce'))p.push(it.akce);if(cols.includes('ticket'))p.push(it.ref);if(cols.includes('popis'))p.push(it.text);const l=p.filter(Boolean).join(' - ');if(l)lines.push(l);});
  }
  if(!lines.length)return;
  copyText(lines.join('\n'),'trk-log-copy-btn');
}

function attendanceTotalStr(att){
  if(!att||!att.checkIn||!att.checkOut) return null;
  const mins=Math.round(trkCalcElapsed(att.checkIn,att.checkOut)/60);
  return Math.floor(mins/60)+':'+pad(mins%60);
}
function trkPunch(type){
  const now=new Date();
  const val=pad(now.getHours())+':'+pad(now.getMinutes());
  trkSetAttendance(type,val);
}
function attApply(day,type,val,src){
  const a=S.attendance[day]||(S.attendance[day]={});
  const sk=type==='checkIn'?'inSrc':'outSrc';
  if(!val){delete a[type];delete a[sk];}
  else{
    a[type]=val;
    if(src)a[sk]=src;else delete a[sk]; // manual entry is never overwritten automatically
    if(type==='checkIn'&&!a.checkOut){
      const pre=(S.attCfg&&S.attCfg.presetOut)||'';
      if(pre&&pre>val){a.checkOut=pre;a.outSrc='preset';}
    }
  }
  if(!Object.keys(a).length)delete S.attendance[day];
}
function trkSetAttendance(type,val){
  if(!val&&!(S.attendance[trkDate]&&S.attendance[trkDate][type]))return;
  attApply(trkDate,type,val,null);
  trkRenderAttendance();
  calSyncAttendanceNote(trkDate);
  saveS();
}
function attIsWorkday(day){
  if(S.calDayType[day])return false;
  const dow=new Date(day+'T00:00:00').getDay();
  return dow>=1&&dow<=5;
}
function attNowHM(){const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes());}
function attAutoStart(){
  if(!S.attCfg||!S.attCfg.autoPunch)return;
  const day=todayStr();
  if(!attIsWorkday(day))return;
  const a=S.attendance[day];
  if(a&&a.checkIn)return;
  attApply(day,'checkIn',attNowHM(),'start');
  calSyncAttendanceNote(day);
  saveS();
}

function attOnClose(){
  if(!S.attCfg||!S.attCfg.autoPunch)return;
  const att=S.attendance[todayStr()];
  if(!att||!att.checkIn)return;                 // no check-in today -> nothing to close
  if(att.checkOut&&!att.outSrc)return;          // manual departure is never overwritten
  const val=attNowHM();
  if(val<=att.checkIn)return;
  att.checkOut=val;att.outSrc='close';
  calSyncAttendanceNote(todayStr());
  saveS();
}
window.addEventListener('beforeunload',attOnClose);

function calSyncAttendanceNote(dateStr){
  const att=S.attendance[dateStr]||{};
  const marker='⏱ '+t('attendanceLine')+': ';
  const note=S.calNotes[dateStr]||'';
  const lines=note.split('\n').filter(l=>!l.startsWith('⏱ ')); // strip any previous attendance line regardless of language
  if(att.checkIn||att.checkOut){
    const total=attendanceTotalStr(att);
    lines.unshift(marker+(att.checkIn||'--:--')+' → '+(att.checkOut||'--:--')+(total?' = '+total:''));
  }
  S.calNotes[dateStr]=lines.join('\n').trim();
}
function trkFillSelects(){
  const ps=document.getElementById('trk-proj-sel'),pv=ps.value;
  ps.innerHTML=`<option value="">${t('selProject')}</option>`;
  S.projDefs.forEach(p=>{const o=document.createElement('option');o.value=p.name;o.textContent=p.name;if(p.name===pv)o.selected=true;ps.appendChild(o);});
  const as=document.getElementById('trk-akce-sel'),av=as.value;
  as.innerHTML=`<option value="">${t('selAction')}</option>`;
  S.akceDefs.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;if(n===av)o.selected=true;as.appendChild(o);});
}
function trkAdd(){
  const akce=document.getElementById('trk-akce-sel').value,proj=document.getElementById('trk-proj-sel').value;
  if(!akce) return;
  const ms=getDayMs(trkDate);
  ms.forEach(m=>{if(!m.running)m.doneFlag=true;});
  ms.unshift({id:uid(),defName:akce,attr:proj||'',elapsed:0,running:false,startedAt:null,doneFlag:false});
  saveS();trkRenderDay();
}
function trkRemove(id){const ms=getDayMs(trkDate),i=ms.findIndex(m=>m.id===id);if(i>=0){ms.splice(i,1);saveS();trkRenderDay();}}
function trkStart(id){
  const m=getDayMs(trkDate).find(x=>x.id===id);if(!m||m.running)return;
  m.running=true;m.startedAt=Date.now();m.doneFlag=false;
  // Save wall-clock start time (HH:MM) for display
  const now=new Date();
  m.startedAtWall=pad(now.getHours())+':'+pad(now.getMinutes());
  m.stoppedAt=null;
  saveS();trkRenderCard(m);trkStartTick();
}
function trkStop(id){
  const m=getDayMs(trkDate).find(x=>x.id===id);if(!m||!m.running)return;
  m.elapsed=getLiveElapsed(m);m.running=false;m.startedAt=null;m.doneFlag=true;
  const now=new Date();
  m.stoppedAt=pad(now.getHours())+':'+pad(now.getMinutes());
  saveS();trkRenderCard(m);trkRenderChips();trkRenderAttrTable();
}
function trkStartTick(){
  if(trkTick)clearInterval(trkTick);
  trkTick=setInterval(()=>{
    const ms=getDayMs(trkDate);if(!ms.some(m=>m.running))return;
    ms.forEach(m=>{if(!m.running)return;const el=document.getElementById('mtime-'+m.id);if(el)el.textContent=fmtSecs(getLiveElapsed(m));});
    trkRenderChips();trkRenderAttrTable();
  },1000);
}
function trkRenderList(){
  const list=document.getElementById('trk-list'),ms=getDayMs(trkDate);
  if(!ms.length){list.innerHTML=`<div class="empty-state">${t('noActions')}</div>`;return;}
  list.innerHTML='';ms.forEach(m=>list.appendChild(trkBuildCard(m)));
}
function trkBuildCard(m){
  const wrap=document.createElement('div');wrap.id='mc-'+m.id;
  wrap.className='mc'+(m.running?' running':'')+((!m.running&&m.doneFlag)?' done':'');
  wrap.innerHTML=trkCardHTML(m);return wrap;
}
function fmtHHMM(ts){if(!ts)return '--:--';return ts;}
function trkCardHTML(m){
  const p=m.attr?getProj(m.attr):null;
  const badge=p?`<span class="mc-badge" style="color:${p.color};border-color:${p.color};background:${p.color}18">${escH(p.name)}</span>`:'';
  const dot=m.running?'<span class="mc-dot"></span>':'';
  const ss=m.running?`<button class="mc-btn stop" onclick="trkStop('${m.id}')">${t('stop')}</button>`:`<button class="mc-btn start" onclick="trkStart('${m.id}')">${t('start')}</button>`;
  const startVal=m.startedAtWall||'';
  const stopVal=m.stoppedAt||'';
  const timeRange=`
    <div class="mc-timerange">
      <input type="time" class="mc-time-inp" value="${startVal}" title="${currentLang==='en'?'Start time':'Čas začátku'}" onblur="trkSetStartTime('${m.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" ${m.running?'disabled':''}>
      <span style="color:var(--text5)">→</span>
      <input type="time" class="mc-time-inp" value="${stopVal}" title="${currentLang==='en'?'End time':'Čas konce'}" onblur="trkSetStopTime('${m.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" ${m.running?'disabled':''}>
    </div>`;
  return `<div class="mc-head">${dot}<span class="mc-name">${escH(m.defName)}</span>${badge}<button class="del-btn" onclick="trkRemove('${m.id}')">×</button></div>
  <div class="mc-body">
    <div>
      <div class="mc-time${m.running?' running':''}" id="mtime-${m.id}">${fmtSecs(getLiveElapsed(m))}</div>
      ${timeRange}
    </div>
    <div class="mc-btns">${ss}<button class="mc-btn" onclick="openEditModal('${m.id}')">${PENCIL_SVG} ${t('edit')}</button></div>
  </div>`;
}

function trkSetStartTime(id,val){
  const m=getDayMs(trkDate).find(x=>x.id===id);if(!m||!val)return;
  m.startedAtWall=val;
  if(!m.running&&m.stoppedAt){ m.elapsed=trkCalcElapsed(val,m.stoppedAt); m.doneFlag=true; }
  saveS();trkRenderCard(m);trkRenderChips();trkRenderAttrTable();
}
function trkSetStopTime(id,val){
  const m=getDayMs(trkDate).find(x=>x.id===id);if(!m||!val)return;
  m.stoppedAt=val;
  if(!m.running&&m.startedAtWall){ m.elapsed=trkCalcElapsed(m.startedAtWall,val); m.doneFlag=true; }
  saveS();trkRenderCard(m);trkRenderChips();trkRenderAttrTable();
}
function trkCalcElapsed(startHHMM,stopHHMM){
  const [sh,sm]=startHHMM.split(':').map(Number);
  const [eh,em]=stopHHMM.split(':').map(Number);
  let secs=(eh*60+em-(sh*60+sm))*60;
  if(secs<0) secs+=24*3600; // handle midnight crossing
  return Math.max(0,secs);
}
function trkRenderCard(m){const c=document.getElementById('mc-'+m.id);if(!c){trkRenderList();return;}c.className='mc'+(m.running?' running':'')+((!m.running&&m.doneFlag)?' done':'');c.innerHTML=trkCardHTML(m);}
function trkRenderChips(){
  const ms=getDayMs(trkDate),total=ms.reduce((a,m)=>a+getLiveElapsed(m),0),running=ms.filter(m=>m.running).length;
  let h=`<div class="chip"><span class="cv">${ms.length}</span><span class="cl">${t('actionsCount')}</span></div><div class="chip"><span class="cv">${fmtSecs(total)}</span><span class="cl">${t('total')}</span></div>`;
  if(running)h+=`<div class="chip" style="border-color:var(--accent)"><span class="cv" style="color:var(--accent)">${running}</span><span class="cl">${t('running')}</span></div>`;
  document.getElementById('trk-chips').innerHTML=h;
}
function trkBuildRows(){return getDayMs(trkDate).map(m=>({id:m.id,attrKey:m.attr||t('noProject'),defName:m.defName,secs:getLiveElapsed(m)}));}
function trkRenderAttrTable(){
  const ms=getDayMs(trkDate),sec=document.getElementById('trk-attr-section');
  if(!ms.length){sec.style.display='none';return;}
  const rows=trkBuildRows();
  const ids=new Set(rows.map(r=>r.id));Object.keys(trkRowChecks).forEach(k=>{if(!ids.has(k))delete trkRowChecks[k];});
  const groups={};rows.forEach(r=>{if(!groups[r.attrKey])groups[r.attrKey]=[];groups[r.attrKey].push(r);});
  const allChecked=rows.length>0&&rows.every(r=>trkRowChecks[r.id]);
  let html=`<thead><tr>
    <th class="cc"><input type="checkbox" ${allChecked?'checked':''} onchange="trkToggleAll(this.checked)"></th>
    <th><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${trkColChecks.projekt?'checked':''} onchange="trkColChecks.projekt=this.checked;trkUpdateCopyBar()"> ${t('colProject')}</label></th>
    <th><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${trkColChecks.akce?'checked':''} onchange="trkColChecks.akce=this.checked;trkUpdateCopyBar()"> ${t('colAction')}</label></th>
    <th><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ${trkColChecks.cas?'checked':''} onchange="trkColChecks.cas=this.checked;trkUpdateCopyBar()"> ${t('colTime')}</label></th>
  </tr></thead><tbody>`;
  Object.entries(groups).forEach(([key,gRows])=>{
    const p=key!==t('noProject')?getProj(key):{color:'#6a6660'};
    const tot=gRows.reduce((a,r)=>a+r.secs,0);
    html+=`<tr class="grp"><td class="cc"></td><td colspan="2"><span class="cdot" style="background:${p.color}"></span><strong>${escH(key)}</strong> <span style="color:var(--text5);font-weight:400">(${gRows.length})</span></td><td><span class="tval">${fmtSecs(tot)}</span></td></tr>`;
    gRows.forEach(r=>{
      const chk=!!trkRowChecks[r.id];
      html+=`<tr class="data"><td class="cc"><input type="checkbox" ${chk?'checked':''} onchange="trkRowChecks['${r.id}']=this.checked;trkUpdateCopyBar();trkSyncAll()"></td>
        <td style="color:var(--text3);font-size:12px;padding-left:22px">${escH(key)}</td>
        <td>${escH(r.defName)}</td><td><span class="tval" style="font-size:12px">${fmtSecs(r.secs)}</span></td></tr>`;
    });
  });
  html+='</tbody>';document.getElementById('trk-attr-tbl').innerHTML=html;sec.style.display='';trkUpdateCopyBar();
}
function trkToggleAll(c){trkBuildRows().forEach(r=>trkRowChecks[r.id]=c);trkRenderAttrTable();}
function trkSyncAll(){const rows=trkBuildRows();const cb=document.querySelector('#trk-attr-tbl thead input[type=checkbox]');if(cb)cb.checked=rows.length>0&&rows.every(r=>trkRowChecks[r.id]);}
function trkUpdateCopyBar(){
  const rows=trkBuildRows(),sel=rows.filter(r=>trkRowChecks[r.id]),cols=Object.entries(trkColChecks).filter(([,v])=>v).map(([k])=>k);
  const parts=[];if(sel.length)parts.push(`${sel.length} ${t('actionsCount')}`);if(cols.length)parts.push((currentLang==='en'?'columns: ':'sloupce: ')+cols.map(c=>({projekt:t('colProject'),akce:t('colAction'),cas:t('colTime')})[c]).join(', '));
  document.getElementById('trk-copy-info').textContent=parts.length?parts.join(' · '):t('checkRowsOrCols');
}
function trkCopy(){
  const rows=trkBuildRows(),cols=['projekt','akce','cas'].filter(c=>trkColChecks[c]),sel=rows.filter(r=>trkRowChecks[r.id]);
  const exportRows=sel.length?sel:(cols.length?rows:[]);if(!exportRows.length&&!cols.length)return;
  const useCols=cols.length?cols:['projekt','akce','cas'];
  const lines=exportRows.map(r=>{const parts=[];if(useCols.includes('projekt'))parts.push(r.attrKey);if(useCols.includes('akce'))parts.push(r.defName);if(useCols.includes('cas'))parts.push(fmtSecs(r.secs));return parts.join('-');});
  copyText(lines.join('\n'),'trk-copy-btn');
}
function openEditModal(id){
  editingMId=id;const m=getDayMs(trkDate).find(x=>x.id===id);if(!m)return;
  const dl=document.getElementById('em-akce-list');dl.innerHTML='';
  S.akceDefs.forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);});

  const ps=document.getElementById('em-proj');ps.innerHTML=`<option value="">${t('noProject')}</option>`;

  const secs=Math.round(getLiveElapsed(m));document.getElementById('em-h').value=Math.floor(secs/3600);document.getElementById('em-m').value=Math.floor((secs%3600)/60);document.getElementById('em-s').value=secs%60;
  document.getElementById('edit-modal-ov').classList.add('open');
}
function closeEditModal(){document.getElementById('edit-modal-ov').classList.remove('open');editingMId=null;}
function saveEditModal(){
  if(!editingMId)return;const m=getDayMs(trkDate).find(x=>x.id===editingMId);if(!m)return;
  m.defName=document.getElementById('em-akce').value.trim()||m.defName;m.attr=document.getElementById('em-proj').value;
  const h=parseInt(document.getElementById('em-h').value)||0,mn=parseInt(document.getElementById('em-m').value)||0,s=parseInt(document.getElementById('em-s').value)||0;
  m.elapsed=h*3600+mn*60+s;if(m.running)m.startedAt=Date.now();

}

/* ══════════════ UKOLOVNÍK ══════════════ */
let todoActiveTab=null,editingTodoId=null,editingTodoTab=null;
function ensureTodoTab(){if(!S.todoTabs.length)S.todoTabs.push({id:uid(),name:t('generalTab'),locked:false,items:[]});if(!todoActiveTab||!S.todoTabs.find(t=>t.id===todoActiveTab))todoActiveTab=S.todoTabs[0].id;}
function renderTodoTabs(){
  ensureTodoTab();
  buildSubTabBar(
    document.getElementById('todo-tabs-bar'),S.todoTabs,todoActiveTab,
    (id)=>{todoActiveTab=id;renderTodoTabs();},
    (id,el)=>startRenameSubTab('todo',id,el),
    lockTodoTab,unlockTodoTab,deleteTodoTab,addTodoTab
  );
  renderTodoContent();
}
function addTodoTab(){S.todoTabs.push({id:uid(),name:t('newTabName'),locked:false,items:[]});todoActiveTab=S.todoTabs[S.todoTabs.length-1].id;saveS();renderTodoTabs();}
function lockTodoTab(id){const x=S.todoTabs.find(y=>y.id===id);if(x){x.locked=true;saveS();renderTodoTabs();}}
function unlockTodoTab(id){const x=S.todoTabs.find(y=>y.id===id);if(x){x.locked=false;saveS();renderTodoTabs();}}
function deleteTodoTab(id){const x=S.todoTabs.find(y=>y.id===id);if(!x||x.locked||S.todoTabs.length<=1)return;S.todoTabs=S.todoTabs.filter(y=>y.id!==id);if(todoActiveTab===id)todoActiveTab=S.todoTabs[0].id;saveS();renderTodoTabs();}
function renderTodoContent(){
  ensureTodoTab();const tab=S.todoTabs.find(x=>x.id===todoActiveTab);if(!tab)return;
  const cont=document.getElementById('todo-content');cont.innerHTML='';
  const addSec=document.createElement('div');addSec.className='section-card';
  addSec.innerHTML=`<div class="section-label">${t('addTask')}</div>
    <div class="row">
    <input class="inp" id="todo-date-inp" type="date" style="min-width:140px" onchange="todoDraftSave()" onclick="try{this.showPicker&&this.showPicker()}catch(e){}">
    <select class="inp" id="todo-proj-inp" style="min-width:120px" onchange="todoDraftSave()"><option value="">${t('selProject')}</option>${S.projDefs.map(p=>`<option value="${escH(p.name)}">${escH(p.name)}</option>`).join('')}</select>
    <input class="inp" id="todo-desc-inp" placeholder="${t('taskDesc')}" style="flex:2;min-width:200px" oninput="todoDraftSave()" onkeydown="if(event.key==='Enter')todoAdd()">
    <button class="sbtn accent" onclick="todoAdd()">＋</button></div>`;
  cont.appendChild(addSec);
  const list=document.createElement('div');list.className='todo-list';
  if(!tab.items.length){list.innerHTML=`<div class="empty-state">${t('noTasks')}</div>`;}
  else{
    // order: active first (urgent on top), then newest date first, same date -> most recently added first; done tasks last
    const sortedItems=tab.items.map((it,i)=>({it,i})).sort((x,y)=>{
      const a=x.it,b=y.it;
      if(!!a.done!==!!b.done) return a.done?1:-1;
      if(!!a.urgent!==!!b.urgent) return a.urgent?-1:1;
      const da=a.date||'',db=b.date||'';
      if(da!==db){ if(!da) return 1; if(!db) return -1; return da<db?1:-1; }
      return y.i-x.i;
    }).map(x=>x.it);
    sortedItems.forEach(item=>{
      const proj=item.proj?getProj(item.proj):null;
      const badge=proj?`<span class="todo-proj-badge" style="color:${proj.color};border-color:${proj.color};background:${proj.color}18">${escH(proj.name)}</span>`:'';
      const alarmBadge=item.alarmEnabled&&item.alarmTime?`<span class="todo-date" title="${t('alarmTime')}">${ALARM_SVG} ${escH(item.alarmTime)}</span>`:'';
      const urgentBadge=item.urgent?`<span class="todo-urgent-badge">🔥 ${t('urgent')}</span>`:'';
      const noteId='note-'+item.id, clId='cl-'+item.id;
      const hasNote=!!(item.note&&item.note.trim()), hasCl=!!(item.checklist&&item.checklist.length);
      const clItems=item.checklist||[];
      const clDone=clItems.filter(c=>c.done).length;
      const clCount=clItems.length?` (${clDone}/${clItems.length})`:'';
      const clHtml=clItems.map(ci=>`<div class="todo-checklist-item${ci.done?' done':''}">
          <input type="checkbox" ${ci.done?'checked':''} onchange="todoChecklistToggle('${tab.id}','${item.id}','${ci.id}',this.checked)">
          <span>${escH(ci.text)}</span>
          <button class="del-btn" onclick="todoChecklistDelete('${tab.id}','${item.id}','${ci.id}')">×</button>
        </div>`).join('');
      const row=document.createElement('div');row.className='todo-row'+(item.done?' checked':'')+(item.urgent&&!item.done?' urgent':'');
      row.innerHTML=`<input type="checkbox" class="todo-cb" ${item.done?'checked':''} onchange="todoToggle('${tab.id}','${item.id}',this.checked)">
        <div class="todo-body"><div class="todo-desc${item.done?' done':''}">${escH(item.desc)}</div>
        <div class="todo-meta">${item.date?`<span class="todo-date">${CAL_SVG} ${item.date}</span>`:''} ${alarmBadge} ${badge} ${urgentBadge}</div>
        <div class="todo-note-area${(hasNote||todoOpenPanels.has(noteId))?' open':''}" id="${noteId}" data-has="${hasNote?1:0}">
          <textarea class="todo-note-inp" placeholder="${t('notePlaceholder')}" oninput="todoAutoSize(this)" onblur="todoSaveNote('${tab.id}','${item.id}',this.value)">${escH(item.note||'')}</textarea>
        </div>
        <div class="todo-checklist-area${(hasCl||todoOpenPanels.has(clId))?' open':''}" id="${clId}" data-has="${hasCl?1:0}">
          ${clHtml}
          <div class="todo-checklist-add">
            <input class="inp todo-checklist-inp" id="cl-inp-${item.id}" placeholder="${t('checklistAddPlaceholder')}" onkeydown="if(event.key==='Enter')todoChecklistAdd('${tab.id}','${item.id}')">
            <button class="sbtn" style="padding:5px 8px" onclick="todoChecklistAdd('${tab.id}','${item.id}')">＋</button>
          </div>
        </div>
        </div>
        <button class="sbtn" style="padding:5px 8px" onclick="todoToLog('${tab.id}','${item.id}',this)" title="${t('toLog')}">${LOGADD_SVG}</button>
        <button class="sbtn${item.urgent?' urgent-active':''}" style="padding:5px 8px" onclick="todoToggleUrgent('${tab.id}','${item.id}')" title="${t('urgent')}">${FLAME_SVG}</button>
        <button class="sbtn${item.note?' has-content':''}" style="padding:5px 8px" onclick="todoTogglePanel('${noteId}')" title="${t('note')}">${NOTE_SVG}</button>
        <button class="sbtn${clItems.length?' has-content':''}" style="padding:5px 8px" onclick="todoTogglePanel('${clId}')" title="${t('checklist')}${clCount}">${CHECKLIST_SVG}</button>
        <button class="sbtn" style="padding:5px 8px" onclick="openTodoModal('${tab.id}','${item.id}')">${PENCIL_SVG}</button>
        <button class="del-btn" onclick="todoDelete('${tab.id}','${item.id}')">×</button>`;
      list.appendChild(row);
      todoAutoSize(row.querySelector('.todo-note-inp'));
    });
  }
  cont.appendChild(list);
  // Restore the unsent draft (survives any re-render of the task list)
  const di=document.getElementById('todo-desc-inp'),dti=document.getElementById('todo-date-inp'),pi=document.getElementById('todo-proj-inp');
  if(todoDraftLive){
    if(di) di.value=todoDraftLive.desc||'';
    if(dti) dti.value=todoDraftLive.date||todayStr();
    if(pi&&todoDraftLive.proj) pi.value=todoDraftLive.proj;
  } else if(dti){ dti.value=todayStr(); }
}
let todoDraftLive=null;
function todoDraftSave(){
  const di=document.getElementById('todo-desc-inp'),dti=document.getElementById('todo-date-inp'),pi=document.getElementById('todo-proj-inp');
  if(!di)return;
  todoDraftLive={desc:di.value,date:dti?dti.value:'',proj:pi?pi.value:''};
}
function todoAdd(){
  const desc=document.getElementById('todo-desc-inp').value.trim();if(!desc)return;
  const date=document.getElementById('todo-date-inp').value,proj=document.getElementById('todo-proj-inp').value;
  const tab=S.todoTabs.find(x=>x.id===todoActiveTab);if(!tab)return;
  tab.items.push({id:uid(),desc,date,proj,done:false});saveS();
  todoDraftLive=null;renderTodoContent();
  document.getElementById('todo-desc-inp').focus();
}
const todoOpenPanels=new Set();
function todoAutoSize(ta){
  if(!ta||!ta.offsetParent)return; // hidden panels have no layout height
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight+2,220)+'px';
}
function todoTogglePanel(id){
  const el=document.getElementById(id);if(!el)return;
  // a note / checklist that has content is always visible: the icon then just moves the cursor into it
  if(el.dataset.has==='1'){const f=el.querySelector('textarea,input.todo-checklist-inp');if(f)f.focus();return;}
  if(todoOpenPanels.has(id))todoOpenPanels.delete(id);else todoOpenPanels.add(id);
  el.classList.toggle('open');
  if(el.classList.contains('open')){const f=el.querySelector('textarea,input.todo-checklist-inp');if(f){todoAutoSize(el.querySelector('textarea'));f.focus();}}
}
function todoSaveNote(tabId,itemId,val){
  const tab=S.todoTabs.find(x=>x.id===tabId);if(!tab)return;
  const item=tab.items.find(i=>i.id===itemId);if(!item)return;
  item.note=val.trim();saveS();
}
function todoChecklistAdd(tabId,itemId){
  const inp=document.getElementById('cl-inp-'+itemId);if(!inp)return;
  const val=inp.value.trim();if(!val)return;
  const tab=S.todoTabs.find(x=>x.id===tabId);if(!tab)return;
  const item=tab.items.find(i=>i.id===itemId);if(!item)return;
  if(!item.checklist)item.checklist=[];
  item.checklist.push({id:uid(),text:val,done:false});
  saveS();renderTodoContent();
}
function todoChecklistToggle(tabId,itemId,clId,checked){
  const tab=S.todoTabs.find(x=>x.id===tabId);if(!tab)return;
  const item=tab.items.find(i=>i.id===itemId);if(!item||!item.checklist)return;
  const ci=item.checklist.find(c=>c.id===clId);if(!ci)return;
  ci.done=checked;saveS();renderTodoContent();

function todoChecklistDelete(tabId,itemId,clId){

  ensureNotesTab();const tab=S.notesTabs.find(x=>x.id===notesActiveTab);if(!tab)return;
  const cont=document.getElementById('notes-content');cont.innerHTML='';
  tab.items.forEach(item=>{

    const titleInp=document.createElement('input');titleInp.className='note-title-inp';titleInp.placeholder=t('notesTitle');titleInp.value=item.title||'';titleInp.readOnly=tab.locked;

    card.appendChild(head);

      const saveBtn=document.createElement('button');saveBtn.className='sbtn accent';saveBtn.innerHTML=SAVE_SVG+' '+t('notesSaveAsTxt');
      saveBtn.onclick=()=>{
        item.title=titleInp.value;item.text=ta.value;item.saved=true;saveS();
        const filename=(item.title.trim()||(currentLang==='en'?'note':'poznamka'))+'.txt';

        const url=URL.createObjectURL(blob);const a=document.createElement('a');
        a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
        card.className='note-card nsaved';savedLbl.classList.add('show');setTimeout(()=>{savedLbl.classList.remove('show');card.className='note-card';},2000);
      };
      footer.appendChild(saveBtn);
      let _noteSaveTimer=null;
      const debouncedSave=()=>{clearTimeout(_noteSaveTimer);_noteSaveTimer=setTimeout(()=>saveS(),400);};
      titleInp.oninput=()=>{item.title=titleInp.value;item.saved=false;card.className='note-card dirty';debouncedSave();};

    }

function dmStartColResize(e,tab,col,th,tbl,colIndex){
  e.preventDefault();
  const isTouch=e.type==='touchstart';
  const startX=isTouch?e.touches[0].clientX:e.clientX;
  const startWidth=th.getBoundingClientRect().width;
  const handle=e.target;
  handle.classList.add('resizing');
  document.body.style.cursor='col-resize';
  document.body.style.userSelect='none';
  // col index in colgroup: 0=highlight, 1=label, 2..=data cols
  const colEl=tbl.querySelector('colgroup')?.children[2+(colIndex??tab.cols.indexOf(col))];
  function onMove(ev){
    const clientX=isTouch?ev.touches[0].clientX:ev.clientX;
    const newWidth=Math.max(50,Math.round(startWidth+(clientX-startX)));
    if(colEl) colEl.style.width=newWidth+'px';
  }
  function onUp(ev){
    const clientX=isTouch?(ev.changedTouches&&ev.changedTouches[0].clientX):ev.clientX;
    const newWidth=Math.max(50,Math.round(startWidth+((clientX??startX)-startX)));
    col.width=newWidth;
    saveS();
    handle.classList.remove('resizing');
    document.body.style.cursor='';
    document.body.style.userSelect='';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onUp);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onUp);
}

function dmImportJSON(event,tabId){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data._type!=='ot-matrix'||!data.cols||!data.rows){ alert(t('importBadFormat')); return; }
      const tab=S.gridTabs.find(x=>x.id===tabId); if(!tab) return;
      tab.title=data.title||''; tab.cornerLabel=data.cornerLabel||'';
      tab.cols=data.cols; tab.rows=data.rows; tab.sumVisible=data.sumVisible;
      dmEnsureCells(tab); saveS(); renderGridContent();
      alert(t('importOk'));
    }catch{ alert(t('importError')); }
  };
  reader.readAsText(file); event.target.value='';
}

// Simple beep using Web Audio API
function playAlarmSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const beep=(freq,start,dur)=>{
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value=freq; osc.type='sine';
      gain.gain.setValueAtTime(0.4,ctx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur);
    };
    beep(880,0,0.18); beep(880,0.22,0.18); beep(1100,0.44,0.32);
  }catch(e){}
}

function showAlarmBanner(desc,time){
  let banner=document.getElementById('alarm-banner');
  if(!banner){
    banner=document.createElement('div'); banner.id='alarm-banner';
    banner.innerHTML=`<span style="font-size:18px">🔔</span><span class="alarm-title"></span><button class="alarm-close" onclick="dismissAlarm()">×</button>`;
    document.body.appendChild(banner);
  }
  banner.querySelector('.alarm-title').textContent=`${t('alarmFired')}: ${desc} (${time})`;
  banner.classList.add('visible');
}

function dismissAlarm(){
  const b=document.getElementById('alarm-banner'); if(b) b.classList.remove('visible');
}

// Check every 30 seconds if any alarm should fire now (within the current minute)
let _alarmInterval=null;
function startAlarmChecker(){
  if(_alarmInterval) clearInterval(_alarmInterval);
  _alarmInterval=setInterval(checkAlarms,30000);
  checkAlarms(); // also check immediately on start/re-render
}

function checkAlarms(){
  const now=new Date();
  const hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
  let dirty=false;

  // Check standalone alarms (Budíky záložka)
  (S.alarms||[]).forEach(al=>{
    if(!al.active||al.time!==hhmm) return;
    const key=al.id+'@'+hhmm;
    if(al._firedKey===key) return;
    al._firedKey=key;
    if(!al.repeat) al.active=false; // one-shot: deactivate after firing
    dirty=true;
    playAlarmSound();
    showAlarmBanner(al.desc,al.time);
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
      try{ new Notification('Office Toolbox – '+t('alarmFired'),{body:al.desc+' ('+al.time+')'}); }catch(e){}
    }
  });

  // Check todo-item alarms
  S.todoTabs.forEach(tab=>{
    tab.items.forEach(item=>{
      if(!item.alarmEnabled||!item.alarmTime||item.done) return;
      if(item.alarmTime!==hhmm) return;
      const key=item.id+'@'+hhmm;
      if(item._alarmFiredKey===key) return;
      item._alarmFiredKey=key;
      dirty=true;
      playAlarmSound();
      showAlarmBanner(item.desc,item.alarmTime);
      if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
        try{ new Notification('Office Toolbox – '+t('alarmFired'),{body:item.desc+' ('+item.alarmTime+')'}); }catch(e){}
      }
    });
  });

  if(dirty){ saveS(); if(document.getElementById('pane-alarm').classList.contains('active')) renderAlarmPage(); }
}
