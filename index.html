const CAL_DAY_TYPES={vacation:{color:'#4a8fd4',key:'dayVacation'},sick:{color:'#d44a4a',key:'daySick'},holiday:{color:'#8fb04a',key:'dayHoliday'}};
function fmtHM(min){min=Math.max(0,Math.round(min));return Math.floor(min/60)+':'+pad(min%60);}
function attMinutes(att){return(att&&att.checkIn&&att.checkOut)?Math.round(trkCalcElapsed(att.checkIn,att.checkOut)/60):null;}
function calDayInfo(ds){
  const type=S.calDayType[ds]||'';
  const norm=attIsWorkday(ds)?Math.round(attCfgNormalize(S.attCfg).dayHours*60):0;
  const worked=attMinutes(S.attendance[ds]);
  return{type,norm,worked,over:worked!=null?Math.max(0,worked-norm):0};
}
function calMonthSummary(y,m){
  const r={worked:0,over:0,days:0,vacation:0,sick:0,holiday:0};
  const n=new Date(y,m+1,0).getDate();
  for(let d=1;d<=n;d++){
    const i=calDayInfo(calDateStr(y,m,d));
    if(i.type)r[i.type]++;
    if(i.worked!=null&&i.worked>0){r.worked+=i.worked;r.over+=i.over;r.days++;}
  }
  return r;
}
function calSummaryHtml(y,m){
  const s=calMonthSummary(y,m);
  const tile=(val,lbl,cls)=>`<div class="cal-sum-item${cls?' '+cls:''}"><div class="cal-sum-val">${val}</div><div class="cal-sum-lbl">${lbl}</div></div>`;
  return `<div class="cal-summary">${tile(fmtHM(s.worked),t('sumWorked'))}${tile((s.over?'+':'')+fmtHM(s.over),t('sumOvertime'),s.over?'over':'')}${tile(s.days,t('sumDays'))}${tile(s.vacation,t('sumVacation'))}${tile(s.sick,t('sumSick'))}${tile(s.holiday,t('sumHolidays'))}</div>`;
}
function calSetDayType(val){
  if(!calDayModalDate)return;
  if(val)S.calDayType[calDayModalDate]=val;else delete S.calDayType[calDayModalDate];
  saveS();renderCalDayInfo();renderCalendar();
}
function renderCalDayInfo(){
  const ds=calDayModalDate,i=calDayInfo(ds),a=S.attendance[ds]||{};
  const sel=document.getElementById('cal-day-type');
  sel.innerHTML=`<option value="">${t('dayNone')}</option>`+Object.keys(CAL_DAY_TYPES).map(k=>`<option value="${k}"${i.type===k?' selected':''}>${t(CAL_DAY_TYPES[k].key)}</option>`).join('');
  const el=document.getElementById('cal-day-att');
  if(i.worked!=null){
    el.innerHTML=`${CHECKIN_SVG} <b>${a.checkIn}</b> → ${CHECKOUT_SVG} <b>${a.checkOut}</b> &nbsp;=&nbsp; <b>${fmtHM(i.worked)}</b>${i.over?` &nbsp;<span style="color:var(--accent)">(+${fmtHM(i.over)} ${t('calDayOver')})</span>`:''}`;
    el.style.display='';
  }else if(a.checkIn||a.checkOut){
    el.innerHTML=`${CHECKIN_SVG} <b>${a.checkIn||'--:--'}</b> → ${CHECKOUT_SVG} <b>${a.checkOut||'--:--'}</b>`;el.style.display='';
  }else el.style.display='none';
}
function czHolidays(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),da=((h+l-7*mm+114)%31)+1;
  const easter=new Date(y,mo-1,da),add=n=>{const x=new Date(easter);x.setDate(x.getDate()+n);return localDateStr(x);};
  const list=[[1,1],[5,1],[5,8],[7,5],[7,6],[9,28],[10,28],[11,17],[12,24],[12,25],[12,26]].map(([m,dd])=>calDateStr(y,m-1,dd));
  list.push(add(1));            // Easter Monday
  if(y>=2016)list.push(add(-2)); // Good Friday (public holiday since 2016)
  return list;
}
function calFillHolidays(){
  const y=calViewDate.getFullYear();
  czHolidays(y).forEach(ds=>{if(!S.calDayType[ds])S.calDayType[ds]='holiday';});
  saveS();renderCalendar();
}
/* KALENDÁŘ */
let calViewDate=new Date(); calViewDate.setDate(1);
let calDayModalDate=null;
let editingCalEventId=null;
let calEventModalFromDay=false;
let calPresetsModalFromDay=false;

function calDateStr(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}

function calEventOccursOn(ev,dateStr){
  if(ev.date===dateStr) return true;
  if(!ev.recur||ev.recur==='none') return false;
  const start=new Date(ev.date+'T00:00:00');
  const cur=new Date(dateStr+'T00:00:00');
  if(cur<start) return false;
  if(ev.recur==='weekly'){
    const diffDays=Math.round((cur-start)/86400000);
    return diffDays%7===0;
  }
  if(ev.recur==='monthly'){
    return cur.getDate()===start.getDate();
  }
  return false;
}
function calEventsForDate(dateStr){
  return S.calEvents.filter(ev=>calEventOccursOn(ev,dateStr));
}

function renderCalendar(){
  const el=document.getElementById('cal-content'); if(!el) return;
  const y=calViewDate.getFullYear(), m=calViewDate.getMonth();
  const monthLabel=calViewDate.toLocaleDateString(currentLang==='cs'?'cs-CZ':'en-US',{month:'long',year:'numeric'});
  const firstOfMonth=new Date(y,m,1);
  let startOffset=(firstOfMonth.getDay()+6)%7; // Monday-first
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrevMonth=new Date(y,m,0).getDate();
  const todayS=todayStr();
  const weekdayNames=currentLang==='cs'?['Po','Út','St','Čt','Pá','So','Ne']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  let cellsHtml='';
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    let dNum,dateStr,otherMonth=false;
    if(i<startOffset){
      dNum=daysInPrevMonth-startOffset+i+1;
      const pm=m===0?11:m-1, py=m===0?y-1:y;
      dateStr=calDateStr(py,pm,dNum); otherMonth=true;
    }else if(i>=startOffset+daysInMonth){
      dNum=i-startOffset-daysInMonth+1;
      const nm=m===11?0:m+1, ny=m===11?y+1:y;
      dateStr=calDateStr(ny,nm,dNum); otherMonth=true;
    }else{
      dNum=i-startOffset+1;
      dateStr=calDateStr(y,m,dNum);
    }
    const evts=calEventsForDate(dateStr);
    const noteTxt=(S.calNotes[dateStr]||'').trim();
    const isToday=dateStr===todayS;
    const evtHtml=evts.slice(0,2).map(ev=>{const c=ev.color||SWATCHES[0];return `<div class="cal-day-evt" style="background:${c}22;color:${c}">${escH(ev.title)}</div>`;}).join('');
    const moreHtml=evts.length>2?`<div class="cal-day-more">+${evts.length-2}</div>`:'';
    const di=calDayInfo(dateStr);
    const typeChip=di.type?`<div class="cal-day-evt" style="background:${CAL_DAY_TYPES[di.type].color}22;color:${CAL_DAY_TYPES[di.type].color}">${t(CAL_DAY_TYPES[di.type].key)}</div>`:'';
    const workedChip=di.worked!=null?`<div class="cal-day-worked">${TRACKER_SVG} ${fmtHM(di.worked)}${di.over?` <span class="over">+${fmtHM(di.over)}</span>`:''}</div>`:'';
    const notePreviewHtml=noteTxt?`<div class="cal-day-note-preview">${NOTE_SVG} ${escH(noteTxt.slice(0,22))}${noteTxt.length>22?'…':''}</div>`:'';
    cellsHtml+=`<div class="cal-day${otherMonth?' other-month':''}${isToday?' today':''}" onclick="openCalDayModal('${dateStr}')">
      <div class="cal-day-flags"><span class="cal-day-num">${dNum}</span></div>
      ${typeChip}${workedChip}${evtHtml}${moreHtml}${notePreviewHtml}
    </div>`;
  }

  el.innerHTML=`
    <div class="cal-header">
      <button class="date-nav-btn" onclick="calChangeMonth(-1)">◀</button>
      <div class="cal-header-title">${monthLabel}</div>
      <button class="date-nav-btn" onclick="calChangeMonth(1)">▶</button>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <button class="sbtn" onclick="calGoToday()">${t('calToday')}</button>
      <button class="sbtn accent" onclick="openCalEventModal(null,todayStr())">${CAL_SVG} ${t('calAddEvent')}</button>
      <button class="sbtn" onclick="openCalPresetsModal()">${GEAR_SVG} ${t('calManagePresets')}</button>
      <button class="sbtn" onclick="calFillHolidays()">${CAL_SVG} ${t('calFillHolidays')}</button>
    </div>
    <div class="cal-weekdays">${weekdayNames.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cellsHtml}</div>
    ${calSummaryHtml(y,m)}
  `;
}
function calChangeMonth(delta){ calViewDate.setMonth(calViewDate.getMonth()+delta); renderCalendar(); }
function calGoToday(){ calViewDate=new Date(); calViewDate.setDate(1); renderCalendar(); }

/* Day modal */
function openCalDayModal(dateStr){
  calDayModalDate=dateStr;
  renderCalDayModal();
  document.getElementById('cal-day-modal-ov').classList.add('open');
}
function closeCalDayModal(){
  calSaveDayNoteDraft();
  document.getElementById('cal-day-modal-ov').classList.remove('open');
  renderCalendar();
}
function calSaveDayNoteDraft(){
  if(!calDayModalDate) return;
  const ta=document.getElementById('cal-day-note');
  if(ta){ S.calNotes[calDayModalDate]=ta.value.trim(); saveS(); }
}
function renderCalDayModal(){
  const dateStr=calDayModalDate;
  document.getElementById('cal-day-title').textContent=dateLabel(dateStr);
  const evts=calEventsForDate(dateStr);
  const evEl=document.getElementById('cal-day-events');
  evEl.innerHTML=evts.length?evts.map(ev=>{const c=ev.color||SWATCHES[0];return `<div class="cal-event-row" style="border-left:3px solid ${c}" onclick="openCalEventModal('${ev.id}','${dateStr}')">
      <span style="flex:1;color:${c};font-weight:600">${escH(ev.title)}</span>
      ${ev.recur&&ev.recur!=='none'?`<span class="cal-event-recur-badge">${t(ev.recur==='weekly'?'calRecurWeekly':'calRecurMonthly')}</span>`:''}
      <span style="color:var(--text4);display:inline-flex">${PENCIL_SVG}</span>
    </div>`;}).join(''):`<div class="empty-state" style="padding:10px 0">${t('calNoEvents')}</div>`;
  document.getElementById('cal-day-note').value=S.calNotes[dateStr]||'';
  renderCalDayInfo();
  calRenderPresetSelect();
}
function calRenderPresetSelect(){
  const sel=document.getElementById('cal-day-preset-sel');
  if(!S.calPresets.length){ sel.innerHTML=`<option value="">${t('calNoPresets')}</option>`; sel.disabled=true; return; }
  sel.disabled=false;
  sel.innerHTML=S.calPresets.map(p=>`<option value="${p.id}">${escH(p.name)}</option>`).join('');
}
function calInsertPreset(){
  const sel=document.getElementById('cal-day-preset-sel');
  const preset=S.calPresets.find(p=>p.id===sel.value);
  if(!preset) return;
  const ta=document.getElementById('cal-day-note');
  ta.value = ta.value ? (ta.value.replace(/\n+$/,'')+'\n'+preset.text) : preset.text;
  calSaveDayNoteDraft();
}
function calCopyDayNote(){
  calSaveDayNoteDraft();
  copyText(document.getElementById('cal-day-note').value,'cal-day-copy-btn');
}
function calInsertTrackerData(){
  if(!calDayModalDate) return;
  const ms=S.days[calDayModalDate]||[];
  if(!ms.length) return;
  const lines=ms.map(m=>{
    const proj=m.attr||t('noProject');
    return [proj,m.defName,fmtSecs(getLiveElapsed(m))].join('-');
  });
  const ta=document.getElementById('cal-day-note');
  ta.value = ta.value ? (ta.value.replace(/\n+$/,'')+'\n'+lines.join('\n')) : lines.join('\n');
  calSaveDayNoteDraft();
}

/* Event modal */
function openCalEventModal(evId,prefillDate){
  calEventModalFromDay=document.getElementById('cal-day-modal-ov').classList.contains('open');
  editingCalEventId=evId;
  const ev=evId?S.calEvents.find(e=>e.id===evId):null;
  document.getElementById('ce-title').value=ev?ev.title:'';
  document.getElementById('ce-date').value=ev?ev.date:(prefillDate||todayStr());
  document.getElementById('ce-recur').value=ev?(ev.recur||'none'):'none';
  document.getElementById('ce-delete-btn').style.display=ev?'inline-flex':'none';
  const colorSel=document.getElementById('ce-color');
  const chosenColor=ev?(ev.color||SWATCHES[0]):SWATCHES[S.calEvents.length%SWATCHES.length];
  colorSel.innerHTML=SWATCHES.map((c,ci)=>`<option value="${c}" ${chosenColor===c?'selected':''}>${t('colorNames')[ci]}</option>`).join('');
  document.getElementById('ce-color-dot').style.background=chosenColor;
  document.getElementById('cal-day-modal-ov').classList.remove('open');
  document.getElementById('cal-event-modal-ov').classList.add('open');
}
function closeCalEventModal(){
  document.getElementById('cal-event-modal-ov').classList.remove('open');
  if(calEventModalFromDay&&calDayModalDate){ renderCalDayModal(); document.getElementById('cal-day-modal-ov').classList.add('open'); }
  calEventModalFromDay=false;
}
function saveCalEventModal(){
  const title=document.getElementById('ce-title').value.trim();
  if(!title) return;
  const date=document.getElementById('ce-date').value||todayStr();
  const recur=document.getElementById('ce-recur').value;
  const color=document.getElementById('ce-color').value;
  if(editingCalEventId){
    const ev=S.calEvents.find(e=>e.id===editingCalEventId);
    if(ev){ ev.title=title; ev.date=date; ev.recur=recur; ev.color=color; }
  }else{
    S.calEvents.push({id:uid(),title,date,recur,color});
  }
  saveS();
  closeCalEventModal();
  renderCalendar();
}
function deleteCalEvent(){
  if(!editingCalEventId) return;
  S.calEvents=S.calEvents.filter(e=>e.id!==editingCalEventId);
  saveS();
  closeCalEventModal();
  renderCalendar();
}

/* Presets modal */
function openCalPresetsModal(){
  calPresetsModalFromDay=document.getElementById('cal-day-modal-ov').classList.contains('open');
  document.getElementById('cal-day-modal-ov').classList.remove('open');
  renderCalPresetsList();
  document.getElementById('cal-presets-modal-ov').classList.add('open');
}
function closeCalPresetsModal(){
  document.getElementById('cal-presets-modal-ov').classList.remove('open');
  if(calPresetsModalFromDay&&calDayModalDate){ renderCalDayModal(); document.getElementById('cal-day-modal-ov').classList.add('open'); }
  else{ renderCalendar(); }
  calPresetsModalFromDay=false;
}
function renderCalPresetsList(){
  const el=document.getElementById('cal-presets-list');
  el.innerHTML=S.calPresets.length?S.calPresets.map(p=>`<div class="cal-preset-row">
      <span class="cal-preset-name">${escH(p.name)}</span>
      <span class="cal-preset-text">${escH(p.text)}</span>
      <button class="del-btn" onclick="calDeletePreset('${p.id}')">×</button>
    </div>`).join(''):`<div class="empty-state" style="padding:10px 0">${t('calNoPresets')}</div>`;
}
function calAddPreset(){
  const nameInp=document.getElementById('cal-preset-name-inp');
  const textInp=document.getElementById('cal-preset-text-inp');
  const name=nameInp.value.trim(), text=textInp.value.trim();
  if(!name||!text) return;
  S.calPresets.push({id:uid(),name,text});
  saveS();
  nameInp.value=''; textInp.value='';
  renderCalPresetsList();
}
function calDeletePreset(id){
  S.calPresets=S.calPresets.filter(p=>p.id!==id);
  saveS();
  renderCalPresetsList();
}
